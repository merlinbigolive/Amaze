<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amaze Vacation — Search Results</title><meta name="description" content="Compare travel offers with Amaze Vacation."><link rel="stylesheet" href="style.css"></head><body class="results-page">
<header class="topbar"><div class="container nav"><a class="brand" href="index.html">Amaze<span>Vacation</span></a><nav id="mainNav"><a href="index.html#search">Search</a><a href="index.html#destinations">Destinations</a><a href="index.html#guides">Guides</a></nav><button class="mobile-menu">☰</button></div></header>
<main><section class="results-head"><div class="container"><div class="crumb"><a href="index.html">Home</a> / Search results</div><h1 id="title">Search results</h1><div id="summary" class="search-summary"></div></div></section>
<section class="container result-layout"><aside class="filters"><div class="filter-title">Filter results</div><label>Max price<input id="maxPrice" type="range" min="1000" max="100000" step="500" value="50000"><output id="priceOut">₹50,000</output></label><label class="check"><input type="checkbox" id="directOnly"> Direct / non-stop</label><label>Sort<select id="sort"><option value="recommended">Recommended</option><option value="price">Lowest price</option><option value="duration">Fastest</option></select></label></aside><div class="results-main"><div class="results-toolbar"><strong id="count">0 options</strong><button id="modify">Modify search</button></div><div id="results"></div></div></section></main>
<footer><div class="container footerline">© 2026 Amaze Vacation · Travel offers are supplied by third-party providers.</div></footer>
<script>
const p=new URLSearchParams(location.search),type=p.get('type')||'hotels',q=Object.fromEntries(p.entries());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+Number(n).toLocaleString('en-IN');
const enc=s=>encodeURIComponent(s||'');
function providerUrl(kind,item){
 if(kind==='hotels') return 'https://www.booking.com/searchresults.html?ss='+enc(q.destination||'')+'&checkin='+enc(q.checkin||'')+'&checkout='+enc(q.checkout||'')+'&group_adults='+enc(q.guests||'2');
 if(kind==='flights'){
   const a=(q.from||'').match(/\b[A-Z]{3}\b/),b=(q.to||'').match(/\b[A-Z]{3}\b/); const from=a?a[0]:encodeURIComponent(q.from||''),to=b?b[0]:encodeURIComponent(q.to||'');
   const d=(q.depart||'').replaceAll('-','').slice(2); return 'https://www.skyscanner.co.in/transport/flights/'+from.toLowerCase()+'/'+to.toLowerCase()+'/'+d+'/';
 }
 if(kind==='cars') return 'https://www.discovercars.com/?pick-up-location='+enc(q.pickup||'');
 if(kind==='activities') return 'https://www.viator.com/searchResults/all?text='+enc(q.destination||'');
 return 'https://12go.asia/en/search?from='+enc(q.from||'')+'&to='+enc(q.to||'')+'&date='+enc(q.date||'');
}
const data={
 hotels:[
  ['The Grand Azure','4.7','Central location · Pool · Free Wi‑Fi',6200,'Free cancellation','https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=900&q=85'],
  ['Harbor View Suites','4.6','Sea view · Breakfast included · Gym',7850,'Free cancellation','https://images.unsplash.com/photo-1564501049412-61c2a3083791?auto=format&fit=crop&w=900&q=85'],
  ['City Crown Hotel','4.5','Near city centre · Restaurant · Parking',4890,'Pay at property','https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?auto=format&fit=crop&w=900&q=85'],
  ['Royal Palm Retreat','4.8','Resort · Spa · Airport transfer',11200,'Free cancellation','https://images.unsplash.com/photo-1584132967334-10e028bd69f7?auto=format&fit=crop&w=900&q=85']
 ],
 flights:[
  ['IndiGo','6E 201','06:15','08:20','2h 05m','Non-stop',4850],['Air India','AI 864','09:30','11:45','2h 15m','Non-stop',5120],['Akasa Air','QP 112','14:10','16:25','2h 15m','Non-stop',5380],['Vistara partner','UK 955','18:30','20:45','2h 15m','Non-stop',6240]
 ],
 trains:[['Rajdhani Express','06:15','14:20','8h 05m','1st / 2nd / 3rd AC',1850],['Shatabdi Express','06:10','10:55','4h 45m','CC / Executive',1250],['Duronto Express','22:00','06:30','8h 30m','AC classes',1620]],
 cars:[['Toyota Urban SUV','SUV','Automatic · 5 seats · Unlimited km',3200],['Hyundai Sedan','Sedan','Automatic · 5 seats · Air conditioning',2450],['Compact Hatchback','Compact','Manual · 5 seats · Unlimited km',1850]],
 activities:[['Desert Safari & Dinner','4.8','Dubai · 6 hours · Pickup available',3200,'https://images.unsplash.com/photo-1459603677915-a62079ffd002?auto=format&fit=crop&w=900&q=85'],['City Highlights Tour','4.7','Guided tour · Half day',2100,'https://images.unsplash.com/photo-1512453979798-5ea266f8880c?auto=format&fit=crop&w=900&q=85'],['Sunset Cruise','4.9','Evening · Dinner option',3900,'https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=900&q=85']]
};
function card(kind,x){let html='';if(kind==='hotels')html=`<article class="result-card"><img src="${x[5]}" alt=""><div class="result-info"><div class="result-top"><h2>${esc(x[0])}</h2><span class="score">${x[1]}</span></div><div class="muted">${esc(x[2])}</div><div class="free">${esc(x[4])}</div></div><div class="pricebox"><small>From</small><strong>${money(x[3])}</strong><span>per night</span><a class="deal" target="_blank" rel="noopener" href="${providerUrl(kind,x)}">View deal</a></div></article>`;
else if(kind==='flights')html=`<article class="result-card flight-card"><div class="airline"><strong>✈ ${esc(x[0])}</strong><span>${esc(x[1])}</span></div><div class="flight-time"><strong>${x[2]}</strong><span>→</span><strong>${x[3]}</strong><small>${x[4]} · ${x[5]}</small></div><div class="pricebox"><small>From</small><strong>${money(x[6])}</strong><span>per traveller</span><a class="deal" target="_blank" rel="noopener" href="${providerUrl(kind,x)}">View deal</a></div></article>`;
else if(kind==='trains')html=`<article class="result-card flight-card"><div class="airline"><strong>🚆 ${esc(x[0])}</strong><span>${esc(x[4])}</span></div><div class="flight-time"><strong>${x[1]}</strong><span>→</span><strong>${x[2]}</strong><small>${x[3]}</small></div><div class="pricebox"><strong>${money(x[5])}</strong><span>per traveller</span><a class="deal" target="_blank" rel="noopener" href="${providerUrl(kind,x)}">View deal</a></div></article>`;
else if(kind==='cars')html=`<article class="result-card flight-card"><div class="airline"><strong>🚗 ${esc(x[0])}</strong><span>${esc(x[1])}</span></div><div class="muted">${esc(x[2])}</div><div class="pricebox"><small>From</small><strong>${money(x[3])}</strong><span>per day</span><a class="deal" target="_blank" rel="noopener" href="${providerUrl(kind,x)}">View deal</a></div></article>`;
else html=`<article class="result-card"><img src="${x[4]}" alt=""><div class="result-info"><div class="result-top"><h2>${esc(x[0])}</h2><span class="score">${x[1]}</span></div><div class="muted">${esc(x[2])}</div></div><div class="pricebox"><strong>${money(x[3])}</strong><span>per person</span><a class="deal" target="_blank" rel="noopener" href="${providerUrl(kind,x)}">View deal</a></div></article>`;return html;}
function render(){let arr=[...(data[type]||data.hotels)];const max=+document.querySelector('#maxPrice').value;if(type==='hotels')arr=arr.filter(x=>x[3]<=max);if(type==='flights')arr=arr.filter(x=>x[6]<=max);if(type==='trains')arr=arr.filter(x=>x[5]<=max);if(type==='cars')arr=arr.filter(x=>x[3]<=max);if(type==='activities')arr=arr.filter(x=>x[3]<=max);const sort=document.querySelector('#sort').value;if(sort==='price')arr.sort((a,b)=>(a[type==='hotels'?3:type==='flights'?6:type==='trains'?5:3])-(b[type==='hotels'?3:type==='flights'?6:type==='trains'?5:3]));document.querySelector('#count').textContent=arr.length+' options';document.querySelector('#results').innerHTML=arr.map(x=>card(type,x)).join('')||'<div class="empty">No options match your filters. Try increasing the price limit.</div>';}
const names={hotels:'Stays',flights:'Flights',trains:'Trains',cars:'Car rentals',activities:'Things to do'};document.title='Amaze Vacation — '+names[type]+' results';document.querySelector('#title').textContent=names[type]+' results';document.querySelector('#summary').textContent=type==='hotels'?`${q.destination||'Your destination'} · ${q.checkin||''} to ${q.checkout||''} · ${q.guests||2} guests`:type==='flights'?`${q.from||''} → ${q.to||''} · ${q.depart||''}`:type==='trains'?`${q.from||''} → ${q.to||''} · ${q.date||''}`:q.destination||q.pickup||'';
document.querySelector('#maxPrice').addEventListener('input',e=>{document.querySelector('#priceOut').value=money(e.target.value);document.querySelector('#priceOut').textContent=money(e.target.value);render()});document.querySelector('#sort').addEventListener('change',render);document.querySelector('#modify').onclick=()=>location.href='index.html#search';render();
</script></body></html>
